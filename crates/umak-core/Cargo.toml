[package]
name = "umak-core"
description = "Library, database, scanner and tag model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Plays through the engine inside this process. Without it the core only speaks the
# player protocol and builds no audio code.
engine = ["umak-audio/engine"]

[dependencies]
serde.workspace = true
umak-audio.workspace = true
umak-convert.workspace = true
rusqlite = { version = "0.41", features = ["array", "bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
ts-rs = "12"
dunce = "1"
lofty = "0.25.5"
unicode-normalization = "0.1.26"
blake3 = { version = "1.8.7", features = ["pure"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }

[dev-dependencies]
tempfile = "3"
