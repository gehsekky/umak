[workspace]
members = ["crates/*", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/gehsekky/umak"

[workspace.dependencies]
umak-core = { path = "crates/umak-core" }
umak-audio = { path = "crates/umak-audio", default-features = false }
umak-convert = { path = "crates/umak-convert" }
serde = { version = "1", features = ["derive"] }
